<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Function Missions • Mrs. Gibson</title>
<style>
:root{--ink:#162b35;--muted:#536871;--paper:#f3f6f3;--green:#12654f;--accent:#12654f;--line:#d4dfd9}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:17px/1.5 system-ui,-apple-system,sans-serif}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:13px 21px;background:var(--accent);color:white;font-weight:750;min-height:48px}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #dc9c23;outline-offset:3px}.ghost{background:white;color:var(--ink);border:1px solid var(--line)}.small{font-size:14px;padding:9px 14px}.shell{max-width:1050px;margin:auto;padding:26px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:30px}.brand{font-weight:850;font-size:19px}.brand span{background:var(--green);color:white;border-radius:10px;padding:8px 10px;margin-right:10px}.teacher{font-size:13px;color:var(--muted)}.eyebrow{font-size:12px;font-weight:850;letter-spacing:2px;text-transform:uppercase;color:var(--accent)}h1{font-size:clamp(34px,6vw,60px);line-height:1.08;letter-spacing:-2px;margin:14px 0 18px}h2{font-size:26px;line-height:1.2;margin:10px 0}h3{font-size:19px;margin:0 0 12px}p{margin:0 0 16px}.lead{font-size:19px;color:var(--muted);max-width:640px}.panel{background:white;border:1px solid var(--line);border-radius:22px;padding:28px}.identity{display:grid;grid-template-columns:1fr 1fr .65fr;gap:16px;margin:28px 0}label{display:block;font-size:14px;font-weight:750}input,select{display:block;width:100%;padding:12px;border-radius:10px;border:1px solid #aabcb4;margin-top:6px;color:var(--ink);background:#fff;min-height:48px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:22px}.choice{padding:30px;position:relative;overflow:hidden;background:#e1eee6;border-color:#b9d1c2}.choice.blue{background:#e3ecf7;border-color:#c2d3e8;--accent:#245d96}.choice .icon{font-size:38px;display:block;margin-bottom:18px}.choice p{color:#354f51}.choice button{width:100%;margin-top:14px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{font-size:12px;font-weight:750;padding:5px 9px;background:#ffffffaa;border-radius:20px}.note{font-size:13px;color:var(--muted);margin-top:18px}.error{color:#a32424;font-weight:650}.missiontop{display:flex;justify-content:space-between;gap:18px;align-items:center}.progress{height:9px;border-radius:20px;background:#dce5df;margin:18px 0 25px;overflow:hidden}.progress div{height:100%;background:var(--accent);transition:width .3s}.layout{display:grid;grid-template-columns:.85fr 1.3fr;gap:22px;align-items:start}.brief{background:#e4eee8;position:sticky;top:20px}.blue-mode{--accent:#245d96}.blue-mode .brief{background:#e5edf7}.metric{padding:13px 0;border-bottom:1px solid #b9cdc1;display:flex;justify-content:space-between;gap:14px;font-size:14px}.metric b{font-size:19px;text-align:right}.questions{display:grid;gap:16px}.q{padding:22px}.q label{font-size:16px}.inputrow{display:flex;gap:10px;align-items:end;margin-top:14px}.inputrow input,.inputrow select{margin:0;flex:1;min-width:0}.inputrow button{flex-shrink:0}.feedback{font-size:14px;margin-top:12px}.feedback.good{color:#12654f}.feedback.bad{color:#a32424}.q.correct{border:2px solid #479275}.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}.hint{font-size:13px;color:var(--muted);margin-top:10px}.summary{width:100%;border-collapse:collapse;margin:20px 0;font-size:14px}.summary td,.summary th{padding:12px 8px;text-align:left;border-bottom:1px solid var(--line)}.badge{font-size:50px}.completion{text-align:center;max-width:800px;margin:auto}.completion .nav{justify-content:center;flex-wrap:wrap}.score{display:inline-block;background:#e1eee6;border-radius:18px;padding:15px 25px;font-size:22px;font-weight:800;margin:12px}.save{font-size:12px;color:var(--muted)}footer{margin-top:35px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:12px}@media(max-width:720px){.shell{padding:18px}.identity,.choices,.layout{grid-template-columns:1fr}.brief{position:static}.panel{padding:22px}.top{margin-bottom:20px}.inputrow{flex-wrap:wrap}.inputrow input,.inputrow select{flex-basis:60%}h1{letter-spacing:-1px}.nav{flex-wrap:wrap}}@media print{body{background:white}.top,footer,.nav,button{display:none!important}.shell{max-width:none}.panel{border:0}.completion{text-align:left}.summary{font-size:11px}.score{padding:0;background:none}}
</style></head><body><div class="shell"><header class="top"><div class="brand"><span>ƒ</span>Function Missions</div><div class="teacher">Mrs. Gibson · Math 8</div></header><main id="app"></main><footer><span>Model Linear Relationships with Functions</span><span id="saveNote">Progress saves on this device.</span></footer></div>
<script>
const DATA={shop:[
 {name:'Costume Studio',icon:'🧵',item:'costumes',unit:'yards of fabric',m:2.5,b:1.5,target:6,buy:24,order:11},
 {name:'Clay Corner',icon:'🏺',item:'bowls',unit:'pounds of clay',m:1.5,b:.5,target:8,buy:18,order:12},
 {name:'Bloom Bar',icon:'💐',item:'bouquets',unit:'feet of ribbon',m:4.5,b:2,target:7,buy:40,order:10},
 {name:'Muffin Market',icon:'🧁',item:'batches of muffins',unit:'cups of flour',m:2.5,b:1,target:5,buy:24,order:10},
 {name:'Birdhouse Works',icon:'🪵',item:'birdhouses',unit:'feet of wood',m:5.5,b:3,target:6,buy:45,order:9},
 {name:'Candle Co.',icon:'🕯️',item:'candles',unit:'pounds of wax',m:.75,b:.25,target:8,buy:10,order:14}
],budget:[
 {name:'Dinner Theater',icon:'🎭',item:'guests',m:18,b:360,target:45,budget:1800},
 {name:'Pottery Party',icon:'🎨',item:'students',m:14,b:225,target:28,budget:1000},
 {name:'Skate Night',icon:'🛼',item:'skaters',m:9,b:120,target:32,budget:500},
 {name:'Gator Picnic',icon:'🧺',item:'guests',m:12,b:175,target:40,budget:900},
 {name:'Pizza Celebration',icon:'🍕',item:'students',m:7.5,b:90,target:24,budget:400},
 {name:'Art Workshop',icon:'🖌️',item:'artists',m:16,b:250,target:18,budget:750}
]};
const KEY='gibson-function-missions-v1';let storageOK=true;let state={first:'',last:'',period:'',mode:null,index:{shop:0,budget:0},progress:{shop:[],budget:[]}};
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&old.progress&&old.index)state=old}catch(e){storageOK=false}
const app=document.getElementById('app');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmt=n=>Number(n.toFixed(3)).toLocaleString('en-US');const money=n=>'$'+n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}document.getElementById('saveNote').textContent=storageOK?'Progress saved on this device.':'Device storage is unavailable. Keep this page open.'}
function result(i=state.index[state.mode]){return state.progress[state.mode][i]??(state.progress[state.mode][i]={a:['','',''],ok:[false,false,false],tries:[0,0,0]})}
function done(mode){return state.progress[mode].filter(r=>r&&r.ok.every(Boolean)).length}
function home(){state.mode=null;save();document.body.classList.remove('blue-mode');app.innerHTML=`<div class="eyebrow">Your mission. Your choice.</div><h1>Make the math<br>work for you.</h1><p class="lead">Choose a challenge, write functions, and put your decisions to the test.</p><div class="identity"><label>First name<input id="first" autocomplete="given-name" value="${esc(state.first)}" maxlength="40"></label><label>Last name<input id="last" autocomplete="family-name" value="${esc(state.last)}" maxlength="40"></label><label>Class period<select id="period"><option value="">Choose…</option>${['3rd','4th','5th','6th'].map(x=>`<option ${state.period===x?'selected':''}>${x}</option>`).join('')}</select></label></div><p id="startError" class="error" role="alert"></p><div class="choices"><section class="panel choice"><span class="icon">🏪</span><div class="eyebrow">Activity 01 · Use what you have</div><h2>Supply Shop Challenge</h2><p>Fill orders for six creative businesses. Figure out what to buy and whether there’s enough to finish the job.</p><div class="chips"><span class="chip">Write a function</span><span class="chip">Calculate supplies</span><span class="chip">Check an order</span></div><button onclick="start('shop')">${done('shop')?'Continue':'Choose'} Supply Shop →</button><div class="note">6 challenges · ${done('shop')} completed</div></section><section class="panel choice blue"><span class="icon">🎟️</span><div class="eyebrow">Activity 02 · Make the budget work</div><h2>Can We Afford It?</h2><p>Plan six events with a starting fee and a cost per person. Work out the total and find how many can attend.</p><div class="chips"><span class="chip">Write a function</span><span class="chip">Find the cost</span><span class="chip">Stay on budget</span></div><button onclick="start('budget')">${done('budget')?'Continue':'Choose'} Budget Challenge →</button><div class="note">6 challenges · ${done('budget')} completed</div></section></div><p class="note">Check each answer and make corrections as needed. Your work stays on this browser and device. A completion summary is available at the end.</p>`;for(const id of ['first','last','period'])document.getElementById(id).addEventListener('input',e=>{state[id]=e.target.value;save()})}
function start(mode){for(const id of ['first','last','period'])state[id]=document.getElementById(id).value.trim();if(!state.first||!state.last||!state.period){document.getElementById('startError').textContent='Enter your first name, last name, and class period before choosing an activity.';return}const owner=[state.first,state.last,state.period].join('|').toLowerCase();if(state.owner&&state.owner!==owner){state.progress={shop:[],budget:[]};state.index={shop:0,budget:0}}state.owner=owner;state.mode=mode;save();if(done(mode)===6)finish();else mission()}
function answers(d,mode){return mode==='shop'?[{m:d.m,b:-d.b},d.m*d.target-d.b,d.buy+d.b>=d.m*d.order?'yes':'no']:[{m:d.m,b:d.b},d.m*d.target+d.b,Math.floor((d.budget-d.b)/d.m)]}
function parseEquation(v){let s=v.toLowerCase().replace(/\s/g,'').replace(/[−–]/g,'-').replace(/×/g,'*');s=s.replace(/^f\(x\)=/,'').replace(/^y=/,'');if(!s.includes('x')||/[^0-9.x+*\-]/.test(s))return null;const terms=s.match(/[+-]?[^+-]+/g);let m=0,b=0,nx=0;for(const t of terms??[]){if(t.includes('x')){if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)?\*?x$/.test(t))return null;let q=t.replace(/\*?x$/,'');m+=q===''||q==='+'?1:q==='-'?-1:Number(q);nx++}else{if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)$/.test(t))return null;b+=Number(t)}}return nx===1&&Number.isFinite(m)&&Number.isFinite(b)?{m,b}:null}
function numeric(v){const s=v.trim().replace(/[$,]/g,'');return /^-?(?:\d+(?:\.\d*)?|\.\d+)$/.test(s)?Number(s):NaN}
function mission(){const mode=state.mode,i=state.index[mode],d=DATA[mode][i],r=result();document.body.classList.toggle('blue-mode',mode==='budget');let prompts=mode==='shop'?[`Write a function for the amount you need to purchase, y, to make x ${d.item}.`,`How many ${d.unit} must you buy to make ${d.target} ${d.item}?`,`You buy ${fmt(d.buy)} ${d.unit}. Including the supply you already have, can you make ${d.order} ${d.item}?`]:[`Write a function for total cost y when x ${d.item} attend.`,`What is the total cost for ${d.target} ${d.item}?`,`Your budget is ${money(d.budget)}. What is the greatest whole number of ${d.item} who can attend?`];app.innerHTML=`<div class="missiontop"><div><div class="eyebrow">${mode==='shop'?'Supply Shop Challenge':'Can We Afford It?'}</div><div class="note" style="margin:5px 0">${esc(state.first)} ${esc(state.last)} · ${esc(state.period)} period</div></div><button class="ghost small" onclick="home()">Activity menu</button></div><div class="progress" role="progressbar" aria-label="Completed challenges" aria-valuenow="${done(mode)}" aria-valuemin="0" aria-valuemax="6"><div style="width:${done(mode)/6*100}%"></div></div><div class="layout"><aside class="panel brief"><div class="eyebrow">Challenge ${i+1} of 6</div><div style="font-size:48px;margin:10px 0">${d.icon}</div><h2>${d.name}</h2>${mode==='shop'?`<p>Your shop uses <b>${fmt(d.m)} ${d.unit}</b> for each item. You already have <b>${fmt(d.b)} ${d.unit}</b>.</p><div class="metric"><span>Needed per item</span><b>${fmt(d.m)}</b></div><div class="metric"><span>Already available</span><b>${fmt(d.b)}</b></div><p class="note">x = number of ${d.item}<br>y = ${d.unit} to purchase<br>Use positive whole numbers for x.</p>`:`<p>This event charges a <b>${money(d.b)} starting fee</b> plus <b>${money(d.m)} per person</b>.</p><div class="metric"><span>Starting fee</span><b>${money(d.b)}</b></div><div class="metric"><span>Per person</span><b>${money(d.m)}</b></div><p class="note">x = number of ${d.item}<br>y = total cost in dollars</p>`}<div class="chips"><span class="chip">${r.ok.filter(Boolean).length}/3 answers checked</span></div></aside><div class="questions">${prompts.map((q,n)=>`<section class="panel q ${r.ok[n]?'correct':''}" id="q${n}"><div class="eyebrow">${['01 · Model it','02 · Calculate it','03 · Decide it'][n]}</div><label for="a${n}">${q}</label>${n===0?'<div class="hint">Use the form y = mx + b or y = mx - b. Decimals are welcome.</div>':''}<div class="inputrow">${mode==='shop'&&n===2?`<select id="a${n}" ${r.ok[n]?'disabled':''}><option value="">Choose an answer…</option><option value="yes" ${r.a[n]==='yes'?'selected':''}>Yes, enough supplies</option><option value="no" ${r.a[n]==='no'?'selected':''}>No, need more supplies</option></select>`:`<input id="a${n}" value="${esc(r.a[n])}" ${r.ok[n]?'readonly':''} ${n>0?'inputmode="decimal"':''} autocomplete="off" spellcheck="false" placeholder="${n===0?'y = …':'Enter a number'}">`}<button onclick="check(${n})" ${r.ok[n]?'disabled':''}>${r.ok[n]?'✓ Correct':'Check'}</button></div><div class="feedback ${r.ok[n]?'good':''}" id="feedback${n}" aria-live="polite">${r.ok[n]?explain(n,d,mode):''}</div></section>`).join('')}</div></div><div class="nav"><button class="ghost" onclick="move(-1)" ${i===0?'disabled':''}>← Back</button><span class="save">${done(mode)} of 6 challenges complete</span><button id="next" onclick="move(1)" ${r.ok.every(Boolean)?'':'disabled'}>${i===5?'See my summary':'Next challenge →'}</button></div>`;for(let n=0;n<3;n++){const el=document.getElementById('a'+n);el.addEventListener('input',()=>{r.a[n]=el.value;save()});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&!r.ok[n])check(n)})}window.scrollTo(0,0)}
function explain(n,d,mode){if(n===0)return mode==='shop'?`✓ Correct. Multiply by ${fmt(d.m)}, then subtract the ${fmt(d.b)} already available.`:`✓ Correct. Multiply the number attending by ${money(d.m)}, then add the ${money(d.b)} fee.`;const ans=answers(d,mode);if(n===1)return `✓ Correct. ${mode==='shop'?`${fmt(d.m)} × ${d.target} − ${fmt(d.b)} = ${fmt(ans[1])} ${d.unit}.`:`${money(d.m)} × ${d.target} + ${money(d.b)} = ${money(ans[1])}.`}`;if(mode==='shop'){const need=d.m*d.order,have=d.buy+d.b;return `✓ Correct. You need ${fmt(need)} and have ${fmt(have)} ${d.unit}. ${have>=need?`${fmt(have-need)} left over.`:`You are ${fmt(need-have)} short.`}`}const max=ans[2];return `✓ Correct. ${max} ${d.item} cost ${money(d.m*max+d.b)}. One more would cost ${money(d.m*(max+1)+d.b)}, which exceeds the budget.`}
function check(n){const mode=state.mode,d=DATA[mode][state.index[mode]],r=result();if(r.ok[n])return;const v=document.getElementById('a'+n).value.trim();r.a[n]=v;const expected=answers(d,mode)[n];let ok=false;if(n===0){const a=parseEquation(v);ok=!!a&&Math.abs(a.m-expected.m)<1e-8&&Math.abs(a.b-expected.b)<1e-8}else if(mode==='shop'&&n===2)ok=v===expected;else ok=Math.abs(numeric(v)-expected)<1e-8;r.tries[n]++;if(ok){r.ok[n]=true;save();mission();document.getElementById('a'+n).focus()}else{save();const f=document.getElementById('feedback'+n);f.className='feedback bad';f.textContent=!v?'Enter an answer first.':n===0?(mode==='shop'?'Try again. The supply already available reduces how much you need to buy.':'Try again. The starting fee is paid once; the per-person charge is multiplied by x.'):n===1?(mode==='shop'?'Try again. Multiply the amount per item by the order size, then subtract the supply already available.':'Try again. Multiply the per-person cost by the attendance, then add the starting fee.'):(mode==='shop'?'Try again. Add the new purchase to the supply already available, then compare with the total needed.':'Try again. Subtract the starting fee from the budget, divide by the per-person cost, and round down.')}}
function move(delta){const i=state.index[state.mode];if(delta>0&&!result().ok.every(Boolean))return;if(i===5&&delta>0){finish();return}state.index[state.mode]=Math.max(0,Math.min(5,i+delta));save();mission()}
function finish(){const mode=state.mode;if(done(mode)!==6){mission();return}const title=mode==='shop'?'Supply Shop Challenge':'Can We Afford It?';const code=(mode==='shop'?'SHOP':'PLAN')+'-'+state.period.toUpperCase()+'-'+state.first.slice(0,1).toUpperCase()+state.last.slice(0,1).toUpperCase()+'-18';app.innerHTML=`<section class="panel completion"><div class="badge">🏆</div><div class="eyebrow">Mission accomplished</div><h1 style="font-size:42px">You made it work.</h1><p><b>${esc(state.first)} ${esc(state.last)}</b> · ${esc(state.period)} period<br>${title}</p><div class="score">18 / 18 answers correct</div><p class="note">Completed with corrections allowed. This summary is saved on this device; it is not sent to your teacher.</p><p><b>Completion code:</b> ${esc(code)}</p><table class="summary"><thead><tr><th>Challenge</th><th>Function</th><th>Status</th></tr></thead><tbody>${DATA[mode].map(d=>`<tr><td>${d.icon} ${d.name}</td><td>y = ${d.m}x ${mode==='shop'?'−':'+'} ${d.b}</td><td>✓ Complete</td></tr>`).join('')}</tbody></table><p class="hint">Show this screen to Mrs. Gibson or print / save it as a PDF.</p><div class="nav"><button onclick="window.print()">Print summary</button><button class="ghost" onclick="review()">Review answers</button><button class="ghost" onclick="home()">Choose another activity</button></div></section>`;save();window.scrollTo(0,0)}
function review(){state.index[state.mode]=0;save();mission()}
if(state.mode&&state.first&&state.last&&state.period){if(done(state.mode)===6)finish();else mission()}else home();
</script></body></html>
