${c}" stroke-width="5" fill="${c}" fill-opacity=".06"/><path d="M369 238v-75a24 24 0 0 1 48 0v75" stroke="${c}" stroke-width="1" opacity=".5"/><circle class="beacon" cx="393" cy="141" r="5" fill="${accent}"/><path d="M348 242h90" stroke="${c}" stroke-width="6"/><path d="M375 180h36m-36 10h36m-36 10h36m-36 10h36m-36 10h36" stroke="${c}" opacity=".17"/><path class="scanner" d="M110 130v112" stroke="${c}" stroke-width="3" opacity=".25"/></g><g class="cargo"><path d="m245 214 25-12 24 12v28l-25 12-24-12Z" fill="#233e57" stroke="${accent}" stroke-width="1.5"/><path d="m245 214 24 12 25-12m-25 12v28m-12-46 24 12" stroke="${accent}" stroke-width="1.5"/><path d="m265 230 7-3v9l-7 3Z" fill="${accent}"/></g><g class="runner"><ellipse cx="171" cy="250" rx="30" ry="5" fill="${agent().color}" opacity=".12"/><svg x="125" y="132" width="90" height="110" viewBox="0 0 90 110">${robotSVG().replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'')}</svg><path d="m145 252 8 9m19-8v12m18-13-7 9" stroke="${agent().color}" opacity=".5" stroke-width="2"/></g><g fill="${accent}"><path d="m88 173 6 9-6 9-6-9Z"/><path d="m112 151 5 8-5 8-5-8Z" opacity=".6"/></g>${blue?`<path d="M0 96q130 60 265 0t275 0" stroke="#56628e"/><g class="beacon" fill="${accent}"><circle cx="35" cy="108" r="4"/><circle cx="93" cy="120" r="4"/><circle cx="150" cy="120" r="4"/><circle cx="210" cy="109" r="4"/><circle cx="278" cy="91" r="4"/><circle cx="339" cy="78" r="4"/><circle cx="404" cy="78" r="4"/><circle cx="470" cy="86" r="4"/></g>`:''}</svg><div class="scene-label">${hero?'NEON DISTRICT · LIVE SECTOR':blue?'SECTOR 02 · FESTIVAL DISTRICT':'SECTOR 01 · SUPPLY DISTRICT'}</div><div class="scene-caption">${blue?'POWER THE NEXT BIG EVENT':'KEEP THE CITY MOVING'}</div></div>`}
function applySettings(){document.documentElement.style.setProperty('--agent',agent().color);document.body.classList.toggle('reduce-motion',!!state.motionOff);const sound=document.getElementById('soundControl'),motion=document.getElementById('motionControl');if(sound){sound.textContent=state.sound?'Sound: ON':'Sound: OFF';sound.setAttribute('aria-pressed',String(!!state.sound))}if(motion){motion.textContent=state.motionOff?'Motion: OFF':'Motion: ON';motion.setAttribute('aria-pressed',String(!state.motionOff))}}
let audio;
function chime(kind='correct'){if(!state.sound)return;try{audio||=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const notes=kind==='victory'?[523,659,784,1047]:kind==='correct'?[523,784]:[220,196];notes.forEach((hz,i)=>{const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type='triangle';o.frequency.value=hz;const t=audio.currentTime+i*.11;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.015);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.start(t);o.stop(t+.24)})}catch(_){}}
function toggleSound(){state.sound=!state.sound;save();applySettings();if(state.sound)chime()}
function toggleMotion(){state.motionOff=!state.motionOff;save();applySettings()}
function chooseAgent(id){state.agent=id;save();home()}
function xpFor(mode){return (state.progress[mode]||[]).reduce((sum,r)=>sum+(r?r.ok.filter(Boolean).length:0),0)*100}
function hud(mode){const xp=xpFor(mode),rank=xp===1200?'DISTRICT CHAMPION':xp>=900?'ELITE COURIER':xp>=600?'POWER RUNNER':xp>=300?'FIELD AGENT':'ROOKIE COURIER';return `<div class="arcade-hud"><div class="player-badge">${robotSVG()}<div><div class="hud-name">${esc(state.first)} · Agent ${agent().name}</div><div class="hud-rank">${rank}</div></div></div><div class="xp"><div><small>ENERGY COLLECTED</small><b>${xp.toLocaleString()} XP</b></div><div class="battery" aria-hidden="true"><div style="width:${xp/12}%"></div></div></div></div>`}
function home(){state.mode=null;save();document.body.classList.remove('blue-mode');applySettings();app.innerHTML=`<section class="hero"><div><div class="live-tag">ARCADE CAMPAIGN / MATH 8</div><h1>The city needs<br>your <em>next move.</em></h1><p class="lead">The Neon District is running low on power. Choose your agent, take a mission, and use functions to bring the city back online.</p><div class="hero-meta"><span><strong>2</strong> MISSION WORLDS</span><span><strong>4</strong> CHECKPOINTS EACH</span><span><strong>YOUR</strong> OWN CHALLENGES</span></div></div>${scene('shop',true)}</section><section class="panel player-panel"><div><div class="eyebrow">01 / Player check-in</div><div class="identity"><label>First name<input id="first" autocomplete="given-name" value="${esc(state.first)}" maxlength="40" placeholder="First name"></label><label>Last name<input id="last" autocomplete="family-name" value="${esc(state.last)}" maxlength="40" placeholder="Last name"></label><label>Class period<select id="period"><option value="">Choose…</option>${['3rd','4th','5th','6th'].map(x=>`<option ${state.period===x?'selected':''}>${x}</option>`).join('')}</select></label></div></div><div class="agent-pick"><div class="eyebrow">02 / Choose your agent</div><div class="agents" role="group" aria-label="Choose your robot agent">${AGENTS.map(a=>`<button class="agent-option" aria-pressed="${agent().id===a.id}" onclick="chooseAgent('${a.id}')">${robotSVG(a.color)}${a.name}</button>`).join('')}</div></div></section><p id="startError" class="error" role="alert"></p><div class="eyebrow" style="margin:4px 0 14px">03 / Select your mission</div><div class="choices"><section class="panel choice">${scene('shop')}<div class="card-body"><div class="eyebrow">Sector 01 · Supply District</div><h2>Supply Shop Challenge</h2><p>Keep the workshops running. Calculate supplies, fill orders, and launch deliveries across the district.</p><div class="chips"><span class="chip">BUILD THE FUNCTION</span><span class="chip">FILL THE ORDER</span><span class="chip">LAUNCH DELIVERY</span></div><button onclick="start('shop')">${done('shop')===4?'View mission results':done('shop')?'Continue mission →':'Enter Supply District →'}</button><div class="note">${done('shop')}/4 CHECKPOINTS RESTORED · UP TO 1,200 XP</div></div></section><section class="panel choice blue">${scene('budget')}<div class="card-body"><div class="eyebrow">Sector 02 · Festival District</div><h2>Can We Afford It?</h2><p>Bring the city’s events to life. Plan the costs, manage the budget, and get the festival powered up.</p><div class="chips"><span class="chip">BUILD THE FUNCTION</span><span class="chip">PLAN THE EVENT</span><span class="chip">BEAT THE BUDGET</span></div><button onclick="start('budget')">${done('budget')===4?'View mission results':done('budget')?'Continue mission →':'Enter Festival District →'}</button><div class="note">${done('budget')}/4 CHECKPOINTS RESTORED · UP TO 1,200 XP</div></div></section></div><p class="note">Your name and period assign your challenge numbers. Each checkpoint has three math tasks. Correct answers earn energy; you can retry without losing progress. Your mission saves on this device.</p>`;for(const id of ['first','last','period'])document.getElementById(id).addEventListener('input',e=>{state[id]=e.target.value;save()});window.scrollTo(0,0)}
function mission(){missionBase();applySettings();const mode=state.mode,i=state.index[mode],r=result();const layout=app.querySelector('.layout');const stages=['ENTRY GATE','POWER HUB','SKY BRIDGE','FINAL CHECKPOINT'];layout.insertAdjacentHTML('beforebegin',hud(mode)+`<nav class="stage-map" aria-label="Mission checkpoints">${stages.map((label,n)=>{const complete=state.progress[mode][n]?.ok.every(Boolean);return `<div class="stage-node ${complete?'complete':''} ${n===i?'active':''} ${n===3?'final':''}" ${n===i?'aria-current="step"':''}><strong>${complete?'✓':n===3?'◆':String(n+1).padStart(2,'0')}</strong><span>${label}</span></div>`}).join('')}</nav>`);const brief=app.querySelector('.brief');brief.insertAdjacentHTML('afterbegin',scene(mode));const icon=brief.querySelector('div[style*="48px"]');if(icon)icon.remove();const complete=r.ok.every(Boolean);brief.insertAdjacentHTML('beforeend',`<div class="bot-message"><div><span>AGENT ${agent().name.toUpperCase()} / COMMS</span>${complete?'Checkpoint restored. Delivery is ready. Head to the next district gate.':i===3?'Final checkpoint. Bring all three power cells online to complete this mission.':mode==='shop'?'We already have some supplies. Figure out what is still needed to get this delivery moving.':'Every event starts with a fee. Keep an eye on the cost per person to stay inside the budget.'}</div></div>`);if(complete)app.querySelector('.nav:not(.stage-map)')?.insertAdjacentHTML('beforebegin',`<div class="stage-ready"><div><strong>✓ CHECKPOINT RESTORED</strong><br>3 power cells online · 300 XP secured</div><span>${i===3?'Mission clear!':'Next gate unlocked →'}</span></div>`);const next=document.getElementById('next');next.textContent=i===3?'Claim mission rewards →':'Next checkpoint →'}
function burst(victory=false){if(state.motionOff||window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;for(let i=0;i<(victory?42:18);i++){const p=document.createElement('i');p.className='particle';p.style.setProperty('--dx',((Math.random()-.5)*(victory?900:450))+'px');p.style.setProperty('--dy',((Math.random()-.2)*450)+'px');p.style.setProperty('--spark',['#5bffca','#ffdb81','#a3baff','#efafff'][i%4]);document.body.append(p);setTimeout(()=>p.remove(),1100)}}
function arcadeReward(complete){document.querySelectorAll('.reward-toast').forEach(el=>el.remove());const toast=document.createElement('div');toast.className='reward-toast';toast.setAttribute('role','status');toast.innerHTML=`${complete?'CHECKPOINT RESTORED':'+100 ENERGY'}<span>${complete?'300 XP SECURED · NEXT GATE UNLOCKED':'POWER CELL ONLINE · KEEP GOING'}</span>`;document.body.append(toast);setTimeout(()=>toast.remove(),1700);burst();const stage=app.querySelector('.brief .scene');stage?.classList.add('shipping');setTimeout(()=>stage?.classList.remove('shipping'),1100);chime(complete?'victory':'correct')}
function check(n){const r=result(),wasCorrect=r.ok[n];checkBase(n);if(!wasCorrect&&r.ok[n])arcadeReward(r.ok.every(Boolean));else if(!r.ok[n]){document.getElementById('q'+n)?.classList.add('wrong-bump');chime('retry')}}
function finish(){finishBase();applySettings();const box=app.querySelector('.completion');if(!box)return;const title=box.querySelector('h1');title.textContent='District restored.';box.querySelector('.eyebrow').textContent='MISSION CLEAR / REWARDS UNLOCKED';box.insertAdjacentHTML('afterbegin',`<div class="victory-agents">${robotSVG()}<div class="victory-medal" aria-label="District champion badge">✦</div></div>`);box.querySelector('.score').insertAdjacentHTML('afterend',`<div class="reward-stats"><div class="reward-stat"><b>1,200</b>ENERGY XP EARNED</div><div class="reward-stat"><b>4 / 4</b>CHECKPOINTS RESTORED</div><div class="reward-stat"><b>CHAMPION</b>DISTRICT RANK</div></div>`);const completionKey=state.mode+'|'+identity();if(!state.celebrated?.includes(completionKey)){state.celebrated||=[];state.celebrated.push(completionKey);save();burst(true);chime('victory')}}
let traveling=false;
function move(delta){if(delta<0||!result().ok.every(Boolean)||state.motionOff){moveBase(delta);return}if(traveling)return;traveling=true;const last=state.index[state.mode]===LIMIT-1;const overlay=document.createElement('div');overlay.className='travel-overlay';overlay.setAttribute('role','status');overlay.innerHTML=`<div class="travel-window"><div class="eyebrow">${last?'FINAL DELIVERY / DISTRICT RESTORED':'DELIVERY IN TRANSIT'}</div><h2>${last?'Bringing the city back online.':'Taking the skyway to the next gate.'}</h2>${scene(state.mode)}<div class="travel-bar"><div></div></div><button class="ghost small" id="skipDelivery">Skip animation</button></div>`;document.body.append(overlay);let timer;const finishTravel=()=>{if(!traveling)return;traveling=false;clearTimeout(timer);overlay.remove();moveBase(delta)};overlay.querySelector('#skipDelivery').onclick=finishTravel;timer=setTimeout(finishTravel,1300)}
function bootArcade(){if(state.motionOff===undefined)state.motionOff=window.matchMedia('(prefers-reduced-motion: reduce)').matches;document.querySelector('.topright')||document.querySelector('.top').insertAdjacentHTML('beforeend','<div class="topright"><div class="controls"><button id="soundControl" class="ghost" onclick="toggleSound()" aria-pressed="false">Sound: OFF</button><button id="motionControl" class="ghost" onclick="toggleMotion()" aria-pressed="true">Motion: ON</button></div></div>');applySettings()}

bootArcade();
ensureAssigned();
if(state.mode&&state.first&&state.last&&state.period){if(done(state.mode)===LIMIT)finish();else mission()}else home();
</script></body></html>
